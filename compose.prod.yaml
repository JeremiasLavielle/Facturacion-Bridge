name: bridge-prod

services:
  caddy:
    image: caddy:2
    container_name: bridge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend-dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    build: .
    container_name: bridge-backend
    restart: unless-stopped
    # El contenedor corre con el UID del dueño de los certificados en el host.
    # La imagen define su propio usuario `bridge`, con un UID distinto, que no
    # puede atravesar arca/<ambiente>/<cuit>/ (700) ni leer la clave privada
    # (600). Igualar el UID resuelve el acceso SIN aflojar esos permisos: la
    # clave privada es la identidad fiscal del emisor y no debe quedar legible
    # para otros usuarios del servidor.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/bridge
      DB_USERNAME: bridge
      DB_PASSWORD: ${DB_PASSWORD}
      OPERADOR_EMAIL: ${OPERADOR_EMAIL}
      OPERADOR_PASSWORD: ${OPERADOR_PASSWORD}
      COOKIE_SEGURA: ${COOKIE_SEGURA:-true}
      ARCA_CERTS_DIR: /arca
      ARCA_URL_WSAA: ${ARCA_URL_WSAA}
      ARCA_URL_WSFE: ${ARCA_URL_WSFE}
      ARCA_AMBIENTE: ${ARCA_AMBIENTE}
    volumes:
      # Se monta SOLO la carpeta del ambiente en uso. El contenedor no llega a
      # ver los certificados del otro ambiente, asi que no puede usarlos por
      # error. Adentro sigue siendo /arca, por eso ARCA_CERTS_DIR no cambia.
      - ./arca/${ARCA_CERTS_ENTORNO:-homologacion}:/arca:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: bridge-postgres-prod
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      POSTGRES_DB: bridge
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - bridge_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d bridge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bridge_pgdata_prod:
  caddy_data:
  caddy_config:
