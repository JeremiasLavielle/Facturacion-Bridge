spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

server:
  servlet:
    session:
      cookie:
        # true = la cookie de sesion solo viaja por HTTPS. Es lo que corresponde.
        # Se baja a false UNICAMENTE en la etapa transitoria sin dominio, cuando
        # el sistema se sirve por IP y todavia no hay certificado. Con false la
        # contrasena y la sesion viajan sin cifrar.
        secure: ${COOKIE_SEGURA:true}

arca:
  certs-dir: ${ARCA_CERTS_DIR:/arca}
  url-wsaa: ${ARCA_URL_WSAA}
  url-wsfe: ${ARCA_URL_WSFE}
  ambiente: ${ARCA_AMBIENTE}
  timeout-conexion-segundos: 15
  timeout-respuesta-segundos: 45
