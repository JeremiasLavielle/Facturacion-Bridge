spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

server:
  servlet:
    session:
      cookie:
        secure: true

arca:
  certs-dir: ${ARCA_CERTS_DIR:/arca}
  url-wsaa: ${ARCA_URL_WSAA}
  url-wsfe: ${ARCA_URL_WSFE}
  ambiente: ${ARCA_AMBIENTE}
  timeout-conexion-segundos: 15
  timeout-respuesta-segundos: 45
