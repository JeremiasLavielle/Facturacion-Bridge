spring:
  application:
    name: bridge-facturacion
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  servlet:
    context-path: /api
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: false

app:
  operador:
    email: ${OPERADOR_EMAIL:}
    password: ${OPERADOR_PASSWORD:}